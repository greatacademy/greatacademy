syntax = "proto3";

package ga.admin.v1;

// AdminService runs the admin console; every call checks the role on the
// server and answers not found to anyone else.
service AdminService {
  // GetOverview returns what needs attention.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // ListVerifications lists the guardian forms waiting, oldest first.
  rpc ListVerifications(ListVerificationsRequest) returns (ListVerificationsResponse);
  // GetVerificationForm returns a waiting form.
  rpc GetVerificationForm(GetVerificationFormRequest) returns (GetVerificationFormResponse);
  // DecideVerification approves or refuses, and deletes the form.
  rpc DecideVerification(DecideVerificationRequest) returns (DecideVerificationResponse);
  // ListMarkets lists every market with its rules and launch state.
  rpc ListMarkets(ListMarketsRequest) returns (ListMarketsResponse);
  // SetMarketOpen opens or closes a market to minors.
  rpc SetMarketOpen(SetMarketOpenRequest) returns (SetMarketOpenResponse);
  // ListProviders lists the AI vendors, never their keys.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // ListCatalog lists the named vendors of pi-ai's catalog an administrator can pick, with their models.
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse);
  // ListRouteChoices lists what a route can name: the criteria of the subjects served, the prompt versions and the languages of speech.
  rpc ListRouteChoices(ListRouteChoicesRequest) returns (ListRouteChoicesResponse);
  // SaveProvider adds or changes a vendor.
  rpc SaveProvider(SaveProviderRequest) returns (SaveProviderResponse);
  // DeleteProvider removes a vendor that has no routes.
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // ListRoutes lists the routes with whether each qualifies.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  // SaveRoute writes a route; going live needs a passing calibration.
  rpc SaveRoute(SaveRouteRequest) returns (SaveRouteResponse);
  // DeleteRoute removes a route.
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);
  // ListRegister lists the vendor register.
  rpc ListRegister(ListRegisterRequest) returns (ListRegisterResponse);
  // SaveRegisterEntry writes what a person checked of a vendor for a market.
  rpc SaveRegisterEntry(SaveRegisterEntryRequest) returns (SaveRegisterEntryResponse);
  // ListNotices lists the notice versions.
  rpc ListNotices(ListNoticesRequest) returns (ListNoticesResponse);
  // PublishNotice adds a notice version naming vendors.
  rpc PublishNotice(PublishNoticeRequest) returns (PublishNoticeResponse);
  // ListAdmins lists who holds the role.
  rpc ListAdmins(ListAdminsRequest) returns (ListAdminsResponse);
  // AddAdmin gives the role to an existing adult account.
  rpc AddAdmin(AddAdminRequest) returns (AddAdminResponse);
  // GrantPlan gives a person a plan for a number of days without payment, as for testers and the pilot.
  rpc GrantPlan(GrantPlanRequest) returns (GrantPlanResponse);
  // RemoveAdmin takes the role from someone else.
  rpc RemoveAdmin(RemoveAdminRequest) returns (RemoveAdminResponse);
  // ListLog lists the change log, newest first.
  rpc ListLog(ListLogRequest) returns (ListLogResponse);
  // ListPrices lists what vendors charge for models.
  rpc ListPrices(ListPricesRequest) returns (ListPricesResponse);
  // SavePrice sets what a vendor charges for a model.
  rpc SavePrice(SavePriceRequest) returns (SavePriceResponse);
  // DeletePrice removes a model's price, which stops its routes serving.
  rpc DeletePrice(DeletePriceRequest) returns (DeletePriceResponse);
  // GetCosts returns spending against budgets, what learners cost, and the alarms.
  rpc GetCosts(GetCostsRequest) returns (GetCostsResponse);
  // GetCheck returns the oldest sampled verdict waiting for a person, without the route's verdict, and logs the reading.
  rpc GetCheck(GetCheckRequest) returns (GetCheckResponse);
  // SaveCheck records a person's verdict on a sample and returns the route's.
  rpc SaveCheck(SaveCheckRequest) returns (SaveCheckResponse);
  // ListDrift compares each route's live verdicts with people's checks.
  rpc ListDrift(ListDriftRequest) returns (ListDriftResponse);
}

message GetOverviewRequest {}

// BandCount is how many learners a band has; an empty band has not answered.
message BandCount {
  string band = 1;
  int32 count = 2;
}

message GetOverviewResponse {
  int32 waiting_forms = 1;
  // stale_checks counts register entries past or within 30 days of their limit.
  int32 stale_checks = 2;
  // broken_routes lists the live routes that stopped qualifying, as "criterion/position".
  repeated string broken_routes = 3;
  // last_retention_at is 0 if the job has never run.
  int64 last_retention_at = 4;
  string last_retention_detail = 5;
  repeated BandCount bands = 6;
  // recent_alarms counts the spending alarms of the last 24 hours.
  int32 recent_alarms = 7;
}

message ListVerificationsRequest {}

// Verification is a guardian's form waiting for a decision.
message Verification {
  string id = 1;
  string email = 2;
  string method = 3;
  int64 submitted_at = 4;
}

message ListVerificationsResponse {
  repeated Verification verifications = 1;
}

message GetVerificationFormRequest {
  string id = 1;
}

message GetVerificationFormResponse {
  bytes form = 1;
  string content_type = 2;
}

message DecideVerificationRequest {
  string id = 1;
  bool approve = 2;
  string reason = 3;
}

message DecideVerificationResponse {}

message ListMarketsRequest {}

// Market is a market's rules from the code and its launch state.
message Market {
  string country = 1;
  // status is the rule: "open", "open-no-ai" or "closed".
  string status = 2;
  int32 guardian_below = 3;
  repeated string languages = 4;
  repeated string missing_languages = 5;
  bool minors_open = 6;
  string signed_off_by = 7;
  string signed_off_on = 8;
  bool language_gap_accepted = 9;
  // ai_scopes are the AI scopes a current register entry can serve now.
  repeated string ai_scopes = 10;
}

message ListMarketsResponse {
  repeated Market markets = 1;
}

message SetMarketOpenRequest {
  string country = 1;
  bool open = 2;
  string signed_off_by = 3;
  string signed_off_on = 4;
  bool language_gap_accepted = 5;
}

message SetMarketOpenResponse {}

message ListProvidersRequest {}

// Provider is an AI vendor, without its key.
message Provider {
  string id = 1;
  string name = 2;
  // kind gave way to the uses of the vendor's routes.
  reserved 3;
  reserved "kind";
  string api = 4;
  string base_url = 5;
  // region moved to each market's entry in the vendor register.
  reserved 6;
  reserved "region";
  // key_hint is the last four characters of the key, empty when none is set.
  string key_hint = 7;
  bool enabled = 8;
  // daily_budget and monthly_budget are in US dollars per UTC day and month;
  // one left unset sets no limit.
  optional double daily_budget = 9;
  optional double monthly_budget = 10;
  // catalog is the id of the named vendor in pi-ai's catalog the vendor was picked from, or empty for one configured by hand.
  string catalog = 11;
}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message ListRouteChoicesRequest {}

// Criterion is a criterion a judgment route can serve.
message Criterion {
  // key is its id and version, such as w4-topic-sentence@1.
  string key = 1;
  string subject_id = 2;
  // question is what the judge asks of the text, in English.
  string question = 3;
}

message ListRouteChoicesResponse {
  repeated Criterion criteria = 1;
  // prompt_versions are the prompts a judgment or conversation route can use.
  repeated string prompt_versions = 2;
  // languages are the language tags a speech route can serve, such as en-US.
  repeated string languages = 3;
  // conversations are the ids of the conversations a conversation route can serve.
  repeated string conversations = 4;
}

message ListCatalogRequest {}

// CatalogModel is a model of a named vendor, with the vendor's list prices in US dollars per million tokens.
message CatalogModel {
  string id = 1;
  string name = 2;
  int32 context_window = 3;
  int32 max_tokens = 4;
  bool reasoning = 5;
  double input_per_million = 6;
  double output_per_million = 7;
}

// CatalogProvider is a named vendor an administrator can pick, which fills in its API, endpoint and models.
message CatalogProvider {
  string id = 1;
  string name = 2;
  string api = 3;
  string base_url = 4;
  repeated CatalogModel models = 5;
}

message ListCatalogResponse {
  repeated CatalogProvider providers = 1;
}

message SaveProviderRequest {
  // provider has an empty id for a new vendor.
  Provider provider = 1;
  // api_key replaces the key; empty keeps the old one.
  string api_key = 2;
}

message SaveProviderResponse {
  string id = 1;
}

message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {}

message ListRoutesRequest {}

// Route is what serves a criterion.
message Route {
  // target is what the route serves within its use: a criterion key such as
  // w4-topic-sentence@1 for judgment, a conversation's id, or a language such
  // as en for speech.
  string target = 1;
  // position is "primary" or "backup".
  string position = 2;
  string provider_id = 3;
  string model = 4;
  string prompt_version = 5;
  bool live = 6;
  // calibrated says whether a passing calibration exists; it is read-only.
  bool calibrated = 7;
  // qualifies says whether the route can serve now.
  bool qualifies = 8;
  // priced says whether its model has a price; it is read-only.
  bool priced = 9;
  // use is "judgment", "conversation", "stt", "tts" or "pronunciation".
  string use = 10;
  // voice is the voice of a text-to-speech route, and empty for any other use.
  string voice = 11;
}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message SaveRouteRequest {
  Route route = 1;
}

message SaveRouteResponse {
  // live is false when a change returned the route to draft.
  bool live = 1;
}

message DeleteRouteRequest {
  string target = 1;
  string position = 2;
  string use = 3;
}

message DeleteRouteResponse {}

message ListRegisterRequest {}

// RegisterEntry is what a person verified of a vendor for a market.
message RegisterEntry {
  string provider_id = 1;
  string country = 2;
  bool serves_market = 3;
  bool minors_allowed = 4;
  bool no_training = 5;
  bool short_retention = 6;
  bool processing_agreement = 7;
  bool transfer_mechanism = 8;
  string region = 9;
  string notes = 10;
  // checked_at and valid are set by the server.
  int64 checked_at = 11;
  bool valid = 12;
}

message ListRegisterResponse {
  repeated RegisterEntry entries = 1;
}

message SaveRegisterEntryRequest {
  RegisterEntry entry = 1;
}

message SaveRegisterEntryResponse {}

message ListNoticesRequest {}

// Notice is a notice version and the vendors it names.
message Notice {
  string version = 1;
  repeated string vendors = 2;
  int64 published_at = 3;
}

message ListNoticesResponse {
  repeated Notice notices = 1;
}

message PublishNoticeRequest {
  string version = 1;
  repeated string vendors = 2;
}

message PublishNoticeResponse {}

message ListAdminsRequest {}

// Admin is someone who holds the role.
message Admin {
  string user_id = 1;
  string email = 2;
  int64 granted_at = 3;
  bool me = 4;
}

message ListAdminsResponse {
  repeated Admin admins = 1;
}

message GrantPlanRequest {
  string email = 1;
  // scope is a subject id, or "all".
  string scope = 2;
  int32 days = 3;
}

message GrantPlanResponse {}

message AddAdminRequest {
  string email = 1;
}

message AddAdminResponse {}

message RemoveAdminRequest {
  string user_id = 1;
}

message RemoveAdminResponse {}

message ListLogRequest {
  // kind filters by the start of the action, such as "market" or "ai".
  string kind = 1;
}

// LogEntry is one recorded change.
message LogEntry {
  string actor = 1;
  string action = 2;
  string target = 3;
  string detail = 4;
  int64 at = 5;
}

message ListLogResponse {
  repeated LogEntry entries = 1;
}

message ListPricesRequest {}

// Price is what a vendor charges for a model, in US dollars per million tokens.
message Price {
  string provider_id = 1;
  string model = 2;
  double input_per_million = 3;
  double output_per_million = 4;
}

message ListPricesResponse {
  repeated Price prices = 1;
}

message SavePriceRequest {
  Price price = 1;
}

message SavePriceResponse {}

message DeletePriceRequest {
  string provider_id = 1;
  string model = 2;
}

message DeletePriceResponse {}

message GetCostsRequest {}

// ProviderSpend is what a vendor has cost this UTC day and month, against its budgets.
message ProviderSpend {
  string provider_id = 1;
  double day = 2;
  double month = 3;
  optional double daily_budget = 4;
  optional double monthly_budget = 5;
}

// LearnerCost is what one learner's calls cost this month.
message LearnerCost {
  string email = 1;
  int32 calls = 2;
  double cost = 3;
}

// Alarm is a spending alarm, as the change log keeps it.
message Alarm {
  int64 at = 1;
  string target = 2;
  string detail = 3;
}

message GetCostsResponse {
  repeated ProviderSpend providers = 1;
  // month_learners counts the learners whose texts were judged this month, and month_cost what judging them cost.
  int32 month_learners = 2;
  double month_cost = 3;
  repeated LearnerCost top_learners = 4;
  repeated Alarm alarms = 5;
}

message GetCheckRequest {}

// Check is a sampled criterion of a live judgment, with the learner's text filtered and no learner named.
message Check {
  string id = 1;
  string task = 2;
  string source = 3;
  string question = 4;
  string text = 5;
}

message GetCheckResponse {
  // check is unset when nothing is waiting.
  optional Check check = 1;
  int32 waiting = 2;
}

message SaveCheckRequest {
  string id = 1;
  bool met = 2;
}

message SaveCheckResponse {
  bool route_met = 1;
}

message ListDriftRequest {}

// RouteDrift is how one route's live verdicts compare with people's checks.
message RouteDrift {
  string criterion = 1;
  string provider_id = 2;
  string model = 3;
  string prompt_version = 4;
  int32 checks = 5;
  double agreement = 6;
  double kappa = 7;
  optional double calibration_kappa = 8;
  bool drifting = 9;
}

message ListDriftResponse {
  repeated RouteDrift routes = 1;
  int32 waiting = 2;
  // min_checks is how many checks a route needs before its drift is judged.
  int32 min_checks = 3;
}
