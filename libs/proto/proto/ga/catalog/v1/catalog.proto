syntax = "proto3";

package ga.catalog.v1;

import "ga/common/v1/text.proto";

// CatalogService describes the subjects and courses on offer. It needs no
// account.
service CatalogService {
  // ListCourses lists the subjects, and every course of every subject without its outline.
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
  // GetCourse returns one course with its outline.
  rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
}

message ListCoursesRequest {}

message ListCoursesResponse {
  repeated Course courses = 1;
  // subjects are the subjects on offer, in the order they are shown.
  repeated Subject subjects = 2;
}

// Subject is a subject on offer and how clients mark it: its mark is one or
// two characters for its chip, and its hue, 0 to 360, gives its colors.
message Subject {
  string id = 1;
  ga.common.v1.Text title = 2;
  string mark = 3;
  int32 hue = 4;
}

message GetCourseRequest {
  string course_id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

// Course is a course of a subject. Course ids are unique across subjects.
message Course {
  string id = 1;
  string subject_id = 2;
  ga.common.v1.Text subject_title = 3;
  ga.common.v1.Text title = 4;
  ga.common.v1.Text description = 5;
  // topic_count counts the course's own topics, foundations excluded.
  int32 topic_count = 6;
  // xp is the sum of the XP of the course's lessons.
  int32 xp = 7;
  // units is the outline; empty in ListCourses.
  repeated Unit units = 8;
  // group names the shelf a list of courses shows the course on; unset for none.
  ga.common.v1.Text group = 9;
  // builds_on lists the courses this one follows on from, nearest first.
  repeated string builds_on = 10;
  // retired marks a course no longer offered to new learners: its learners
  // keep it, catalogs leave it out for everyone else, and ChooseCourse refuses it.
  bool retired = 11;
}

message Unit {
  ga.common.v1.Text title = 1;
  repeated Module modules = 2;
}

message Module {
  ga.common.v1.Text title = 1;
  repeated Topic topics = 2;
}

message Topic {
  string id = 1;
  ga.common.v1.Text title = 2;
  ga.common.v1.Text summary = 3;
  int32 xp = 4;
  int32 knowledge_points = 5;
}
