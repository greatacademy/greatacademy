syntax = "proto3";

package ga.learning.v1;

import "ga/common/v1/figure.proto";
import "ga/common/v1/text.proto";

// LearningService is the signed-in learner's study: the current course of each
// subject, the dashboard of tasks, and the sessions that carry out tasks one
// question at a time.
// Problems are generated and checked on the server; an answer never reaches
// the client before the learner responds.
service LearningService {
  // GetProfile summarizes the learner: current courses and XP.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // ChooseCourse makes a course the current course of its subject, replacing
  // the one before. Only the learner's supervisor chooses: an adult, a teen
  // no guardian follows, or a guardian for the learners they follow.
  rpc ChooseCourse(ChooseCourseRequest) returns (ChooseCourseResponse);
  // SetGoals sets the XP goal of each weekday in a subject; only the
  // learner's supervisor sets it.
  rpc SetGoals(SetGoalsRequest) returns (SetGoalsResponse);
  // SetEndDate sets or clears the day a subject's current course should be
  // finished by; only the learner's supervisor sets it.
  rpc SetEndDate(SetEndDateRequest) returns (SetEndDateResponse);
  // KeepCourse answers the diagnostic report by keeping the current course.
  rpc KeepCourse(KeepCourseRequest) returns (KeepCourseResponse);
  // GetDashboard returns the tasks offered in a course now.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  // GetCourseProgress returns the learner's status on every topic of a course.
  rpc GetCourseProgress(GetCourseProgressRequest) returns (GetCourseProgressResponse);
  // StartTask starts one of the offered tasks, or resumes the active session.
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  // SkipDiagnostic places the learner at the beginning of the course.
  rpc SkipDiagnostic(SkipDiagnosticRequest) returns (SkipDiagnosticResponse);
  // RetakeDiagnostic starts a course's diagnostic over: the topics it placed
  // are asked again, while topics taught in lessons, XP and history stay.
  // Only the learner's supervisor retakes it.
  rpc RetakeDiagnostic(RetakeDiagnosticRequest) returns (RetakeDiagnosticResponse);
  // ResetKnowledge forgets every topic the learner knows in a subject, so its
  // current course starts with the diagnostic again; XP and history stay.
  // Only the learner's supervisor resets it.
  rpc ResetKnowledge(ResetKnowledgeRequest) returns (ResetKnowledgeResponse);
  // GetSession returns a session as it stands.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // SubmitAnswer answers the current question of a session.
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  // GetTopic returns a topic's lesson to reread, and how it connects to other topics.
  rpc GetTopic(GetTopicRequest) returns (GetTopicResponse);
  // ListSessions lists the learner's finished sessions in a course, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

message GetProfileRequest {
  // time_zone is an IANA time zone such as "Asia/Shanghai"; days for XP are counted in it.
  string time_zone = 1;
}

message GetProfileResponse {
  // enrollments are the current courses, one per subject, the one most recently chosen or worked on first.
  repeated Enrollment enrollments = 1;
  // xp sums every subject, and its goals are the sums of the subjects' goals.
  XpSummary xp = 2;
  // can_decide tells whether the learner is their own supervisor, who
  // chooses courses and sets goals; otherwise a guardian does.
  bool can_decide = 3;
}

// Enrollment is a learner's current course of a subject.
message Enrollment {
  string course_id = 1;
  CourseStats stats = 2;
  string subject_id = 3;
  // xp is the learner's XP in the subject, against the subject's goals.
  XpSummary xp = 4;
}

// Goals are the XP to earn on each weekday in a subject.
message Goals {
  // weekdays holds seven values, Monday first; it is empty until goals are set.
  repeated int32 weekdays = 1;
  bool paused = 2;
}

message SetGoalsRequest {
  string subject_id = 1;
  Goals goals = 2;
  // learner_id, when set, sets the goals of a learner the caller is a guardian of.
  string learner_id = 3;
}

message SetGoalsResponse {}

message SetEndDateRequest {
  string subject_id = 1;
  // end_date is "YYYY-MM-DD", or empty to clear it.
  string end_date = 2;
  // learner_id, when set, sets the date of a learner the caller is a guardian of.
  string learner_id = 3;
}

message SetEndDateResponse {}

// CourseStats counts course topics: learned (taught or placed), in all, and due for review.
message CourseStats {
  int32 learned = 1;
  int32 total = 2;
  int32 due = 3;
}

message XpSummary {
  int32 total = 1;
  int32 today = 2;
  // days is the XP of each of the last 14 days, oldest first, today last.
  repeated int32 days = 3;
  // goal_today and goal_week are the goals in XP; 0 means none.
  int32 goal_today = 4;
  int32 goal_week = 5;
  // week is the XP since Monday, in the learner's time zone.
  int32 week = 6;
}

message ChooseCourseRequest {
  string course_id = 1;
  // learner_id, when set, chooses for a learner the caller is a guardian of.
  string learner_id = 2;
}

message ChooseCourseResponse {}

message KeepCourseRequest {
  string course_id = 1;
  // learner_id, when set, keeps the course of a learner the caller is a guardian of.
  string learner_id = 2;
}

message KeepCourseResponse {}

// PlacementReport is what a course's diagnostic found, shown until whoever
// chooses the course keeps it or takes the recommended one.
message PlacementReport {
  // placed counts the course's own topics placed as known, of total.
  int32 placed = 1;
  int32 total = 2;
  // foundations counts the topics of earlier courses still to learn first.
  int32 foundations = 3;
  // recommended is the course to start with instead; empty to keep this one.
  string recommended = 4;
  // earlier tells that the recommended course comes before this one; else it comes after.
  bool earlier = 5;
}

message GetDashboardRequest {
  string course_id = 1;
  string time_zone = 2;
  // learner_id, when set, reads a learner the caller is a guardian of instead of the caller.
  string learner_id = 3;
}

message GetDashboardResponse {
  string course_id = 1;
  // diagnosed is false until the learner took or skipped the diagnostic.
  bool diagnosed = 2;
  repeated Task tasks = 3;
  // active is the session in progress, if any; StartTask resumes it.
  optional SessionSummary active = 4;
  CourseStats stats = 5;
  // xp is the learner's XP in the course's subject, against the subject's goals.
  XpSummary xp = 6;
  // xp_to_quiz is the XP still to earn before the next quiz.
  int32 xp_to_quiz = 7;
  // remaining_xp estimates the XP the course still takes.
  int32 remaining_xp = 8;
  // pace is the learner's average XP per day over the last 14 days.
  double pace = 9;
  // report is the diagnostic report, until it is answered; unset after a skipped diagnostic.
  optional PlacementReport report = 10;
  // finished tells that every topic of the course is learned.
  bool finished = 11;
  // next_courses are the courses that build on this one, in catalog order.
  repeated string next_courses = 12;
  // can_decide tells whether the caller is the learner's supervisor, who
  // changes the course and sets the goals and the end date.
  bool can_decide = 13;
  string subject_id = 14;
  Goals goals = 15;
  // end_date is the day the course should be finished by, "YYYY-MM-DD", or empty.
  string end_date = 16;
}

// Task is a unit of work offered on the dashboard.
message Task {
  oneof kind {
    DiagnosticTask diagnostic = 1;
    LessonTask lesson = 2;
    ReviewTask review = 3;
    QuizTask quiz = 4;
    ReadingTask reading = 5;
  }
}

message DiagnosticTask {
  // max_questions is the most questions the diagnostic asks.
  int32 max_questions = 1;
}

message LessonTask {
  string topic_id = 1;
  ga.common.v1.Text title = 2;
  int32 xp = 3;
  int32 knowledge_points = 4;
  // from_course is the earlier course a foundation comes from; unset for the course's own topics.
  optional ga.common.v1.Text from_course = 5;
}

message ReviewTask {
  string topic_id = 1;
  ga.common.v1.Text title = 2;
  int32 xp = 3;
  // covers are the due topics the review repairs, the reviewed topic included when due.
  repeated string covers = 4;
  // from_course is the earlier course a foundation comes from; unset for the course's own topics.
  optional ga.common.v1.Text from_course = 5;
}

message QuizTask {
  int32 questions = 1;
  int32 xp = 2;
}

message ReadingTask {
  string passage_id = 1;
  ga.common.v1.Text title = 2;
  int32 xp = 3;
  int32 questions = 4;
  // words counts the running words of the passage.
  int32 words = 5;
}

message SessionSummary {
  string id = 1;
  Task task = 2;
}

message GetCourseProgressRequest {
  string course_id = 1;
  // learner_id, when set, reads a learner the caller is a guardian of instead of the caller.
  string learner_id = 2;
}

message GetCourseProgressResponse {
  repeated TopicProgress topics = 1;
}

// TopicStatus is a learner's standing on a topic.
enum TopicStatus {
  TOPIC_STATUS_UNSPECIFIED = 0;
  // Not learned, and some prerequisite is not known yet.
  TOPIC_STATUS_LOCKED = 1;
  // On the frontier: can be learned now.
  TOPIC_STATUS_AVAILABLE = 2;
  // The lesson was failed; it waits for its key prerequisites to be reviewed.
  TOPIC_STATUS_FAILED = 3;
  // Learned, and not due.
  TOPIC_STATUS_LEARNED = 4;
  // Learned, and due for review.
  TOPIC_STATUS_DUE = 5;
  // Below the course's mastery floor: assumed known.
  TOPIC_STATUS_ASSUMED = 6;
}

message TopicProgress {
  string topic_id = 1;
  TopicStatus status = 2;
  // placed is true when the diagnostic, not a lesson, made the topic learned.
  bool placed = 3;
  // memory is the engine's retention estimate in [0, 1]; 0 when not learned.
  double memory = 4;
  // foundation is true for a topic outside the course that the course builds on.
  bool foundation = 5;
}

message StartTaskRequest {
  string course_id = 1;
  // task must be one of the tasks the dashboard offers now.
  Task task = 2;
  // time_zone is the IANA zone whose day a guardian's time limit counts; empty means UTC.
  string time_zone = 3;
}

message StartTaskResponse {
  Session session = 1;
}

message SkipDiagnosticRequest {
  string course_id = 1;
}

message SkipDiagnosticResponse {}

message RetakeDiagnosticRequest {
  string course_id = 1;
  // learner_id, when set, retakes for a learner the caller is a guardian of.
  string learner_id = 2;
}

message RetakeDiagnosticResponse {}

message ResetKnowledgeRequest {
  string subject_id = 1;
  // learner_id, when set, resets a learner the caller is a guardian of.
  string learner_id = 2;
}

message ResetKnowledgeResponse {}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

// Session is a task being carried out.
message Session {
  string id = 1;
  string course_id = 2;
  Task task = 3;
  // answered counts the questions answered so far.
  int32 answered = 4;
  oneof step {
    // question is the question to answer next.
    Question question = 5;
    // result ends the session.
    Result result = 6;
  }
}

// Question is a question of a session.
message Question {
  // index numbers the questions of a session from 0; SubmitAnswer repeats it.
  int32 index = 1;
  // intro is set on the first question of each knowledge point of a lesson.
  optional KnowledgePointIntro intro = 2;
  ProblemView problem = 3;
  // feedback is true when each answer is judged at once (lessons, reviews);
  // false when results come at the end (quizzes, the diagnostic). Reading is judged at once.
  bool feedback = 4;
  // can_skip is true where "I don't know" is allowed (the diagnostic only).
  bool can_skip = 5;
  // lesson is the lesson's progress, for lessons only.
  optional LessonProgress lesson = 6;
  // total is the number of questions, when known in advance (reviews, quizzes,
  // reading); 0 otherwise.
  int32 total = 7;
  // passage is the text the questions are about, for reading only.
  optional Passage passage = 8;
}

// Passage is a text to read. Its body is in the language being read, with
// paragraphs separated by blank lines.
message Passage {
  ga.common.v1.Text title = 1;
  string body = 2;
}

message KnowledgePointIntro {
  int32 index = 1;
  int32 count = 2;
  ga.common.v1.Text title = 3;
  ga.common.v1.Text explanation = 4;
  WorkedExample example = 5;
  // figure is a drawing shown after the explanation.
  optional ga.common.v1.Figure figure = 6;
  // figures are drawings placed inside the explanation, each by a line
  // "{{figure N}}", N being its index.
  repeated ga.common.v1.Figure figures = 7;
}

// WorkedExample is a problem shown with its solution.
message WorkedExample {
  ProblemView problem = 1;
  ga.common.v1.Text solution = 2;
  // answer is the canonical response, as a learner would enter it.
  string answer = 3;
  // solution_figure is a drawing that shows the solution.
  optional ga.common.v1.Figure solution_figure = 4;
}

message LessonProgress {
  // knowledge_point is the index of the current knowledge point.
  int32 knowledge_point = 1;
  int32 knowledge_points = 2;
  // streak is the current run of correct answers on this knowledge point.
  int32 streak = 3;
  // needed is the run that passes a knowledge point.
  int32 needed = 4;
}

// ProblemView is what a client may see of a problem before answering.
message ProblemView {
  ga.common.v1.Text prompt = 1;
  Input input = 2;
  // figure is a drawing the prompt refers to.
  optional ga.common.v1.Figure figure = 3;
}

message Input {
  oneof kind {
    ChoiceInput choice = 1;
    MathInput math = 2;
    TextInput text = 3;
    PlotInput plot = 4;
    OrderInput order = 5;
  }
}

// ChoiceInput: the response is the index of the chosen option, in decimal.
message ChoiceInput {
  repeated ga.common.v1.Text options = 1;
  // figures, when present, holds one drawing per option; each option is shown as its drawing, and its text only names it.
  repeated ga.common.v1.Figure figures = 2;
}

// MathInput: the response is LaTeX.
message MathInput {
  // prefix and suffix are LaTeX shown around the field, such as "x =".
  string prefix = 1;
  string suffix = 2;
}

message TextInput {}

// OrderInput: a list to put in order. The response lists the indexes of the items in the chosen order, such as "2,0,1".
message OrderInput {
  repeated ga.common.v1.Text items = 1;
}

// PlotInput: points are marked on the problem's figure. The response lists them as "(x, y)", joined by "; ".
message PlotInput {
  double x_min = 1;
  double x_max = 2;
  double y_min = 3;
  double y_max = 4;
  // step is the distance between the points that can be marked.
  double step = 5;
  // left and top are the position in the figure's viewBox of the corner (x_min, y_max).
  double left = 6;
  double top = 7;
  // scale is the length in the viewBox of one unit along either axis.
  double scale = 8;
  // points is how many points to mark.
  int32 points = 9;
}

message SubmitAnswerRequest {
  string session_id = 1;
  // index is the index of the question answered; a stale index is rejected.
  int32 index = 2;
  string response = 3;
  // skip answers "I don't know" where allowed.
  bool skip = 4;
}

message SubmitAnswerResponse {
  // feedback judges the answer; unset where results come at the end.
  optional Feedback feedback = 1;
  Session session = 2;
}

message Feedback {
  bool correct = 1;
  // message explains a rejection that is not simply wrong, such as an unsimplified fraction.
  optional ga.common.v1.Text message = 2;
  ga.common.v1.Text solution = 3;
  // answer is the canonical response.
  string answer = 4;
  // solution_figure is a drawing that shows the solution.
  optional ga.common.v1.Figure solution_figure = 5;
}

message GetTopicRequest {
  string course_id = 1;
  string topic_id = 2;
  // example_seed picks the worked examples, so that a learner can ask for others.
  int32 example_seed = 3;
}

message GetTopicResponse {
  string topic_id = 1;
  ga.common.v1.Text title = 2;
  ga.common.v1.Text summary = 3;
  TopicStatus status = 4;
  // knowledge_points are the steps of the lesson, each with a worked example.
  repeated KnowledgePointIntro knowledge_points = 5;
  // prerequisites are the topics this one builds on.
  repeated TopicLink prerequisites = 6;
  // dependents are the topics of the course that build on this one.
  repeated TopicLink dependents = 7;
}

// TopicLink names another topic and the learner's standing on it.
message TopicLink {
  string topic_id = 1;
  ga.common.v1.Text title = 2;
  TopicStatus status = 3;
}

message ListSessionsRequest {
  string course_id = 1;
  // learner_id, when set, reads a learner the caller is a guardian of instead of the caller.
  string learner_id = 2;
}

message ListSessionsResponse {
  repeated FinishedSession sessions = 1;
}

// FinishedSession is one line of a learner's history; GetSession returns the whole session.
message FinishedSession {
  string id = 1;
  Task task = 2;
  // completed_at is in milliseconds since the epoch.
  int64 completed_at = 3;
  bool passed = 4;
  int32 correct = 5;
  int32 asked = 6;
  int32 xp = 7;
  // full_xp is what the task is worth when done well, before any bonus.
  int32 full_xp = 8;
  // blown_off tells that the task was rushed through.
  bool blown_off = 9;
}

// Result ends a session.
message Result {
  bool passed = 1;
  int32 correct = 2;
  int32 asked = 3;
  int32 xp = 4;
  // items are the questions with their outcomes, for lessons, quizzes and reviews.
  repeated ResultItem items = 5;
  // placed counts the topics the diagnostic placed as known.
  int32 placed = 6;
  // full_xp is what the task is worth when done well, before any bonus.
  int32 full_xp = 7;
  // blown_off tells that the task was rushed through, which earns no XP and, when repeated, costs some.
  bool blown_off = 8;
  // passage is the text a reading task asked about, so that its answers can be read against it.
  optional Passage passage = 9;
}

message ResultItem {
  string topic_id = 1;
  ga.common.v1.Text title = 2;
  bool correct = 3;
  ProblemView problem = 4;
  ga.common.v1.Text solution = 5;
  string answer = 6;
  string response = 7;
  // solution_figure is a drawing that shows the solution.
  optional ga.common.v1.Figure solution_figure = 8;
}
