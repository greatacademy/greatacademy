[tools]
node = "26.11.1"
pnpm = "12.11.2"
# Code generation of libs/proto.
buf = "1.73.0"
# The voice service (apps/voice), the one Python project.
python = "3.14.8"
uv = "0.13.5"
# The native apps (apps/nsh) use Native Shell built from its main branch, installed apart from mise:
# curl -fsSL https://nsh.dev/install.sh | sh -s -- --source
# The cluster's manifests (deploy/k8s): rendering and schema validation.
kustomize = "5.8.2"
kubeconform = "0.7.0"

[tasks."k8s:push"]
description = "Build the API and voice images, push them to GHCR and pin deploy/k8s to their digests"
run = "deploy/k8s/push.sh"

[tasks."k8s:check"]
description = "Render deploy/k8s and validate it"
run = "deploy/k8s/check.sh"
