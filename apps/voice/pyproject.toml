[project]
name = "ga-voice"
version = "0.0.0"
description = "The voice service of Great Academy: live conversation (S6) on Pipecat."
requires-python = "==3.14.*"
license = "MIT"
dependencies = [
  "pipecat-ai[websocket]==1.15.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "cryptography==50.0.2",
  "httpx==0.28.1",
]

[project.scripts]
ga-voice = "ga_voice.main:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.2",
  "pyright==1.1.414",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ga_voice"

[tool.uv]
# Transitive dependencies must be at least two weeks old, like the direct ones; Pipecat is pinned explicitly.
exclude-newer = "2026-10-26T00:00:00Z"
exclude-newer-package = { pipecat-ai = "2026-10-30T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "D", "ANN", "PT", "N", "BLE", "T20"]
ignore = [
  "D203", # one blank line before class docstring (conflicts with D211)
  "D213", # multi-line summary on the second line (conflicts with D212)
  "D100", # module docstrings are optional
  "D104", # package docstrings are optional
  "D105", # magic methods need no docstring
  "D107", # __init__ is documented by its class
  "D401", # docstrings start with the identifier's name (AGENTS.md), not an imperative verb
  "D403", # ... so the first word may be lower case
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "D", "ANN", "S105", "S106"]
"tests/**" = ["S101", "D", "ANN", "S105", "S106", "ASYNC109", "ASYNC110"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Pipecat ships without complete type information.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
