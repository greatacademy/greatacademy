# The public hosts, through the cluster's ingress-nginx. Both hosts are proxied by Cloudflare, which sets
# CF-Connecting-IP to the learner's address. Cloudflare presents our client certificate to the origin (authenticated
# origin pulls, README) and nginx accepts only a connection that presents it, so every request comes through Cloudflare and
# its CF-Connecting-IP can be trusted. cert-manager's letsencrypt-prod-issuer makes each host's certificate with a
# DNS-01 challenge, and external-dns writes each host's proxied record; both are set up for greatacademy.dev in the
# cluster's own repository. Only the API's /api reaches the API: the voice service's calls under /voice/v1, the
# probes and the metrics stay inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: greatacademy/origin-pull-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    # Guardians' signed forms are the largest requests.
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.greatacademy.dev
      secretName: api-tls
  rules:
    - host: api.greatacademy.dev
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
# The voice service's WebSocket: a conversation lasts at most 24 minutes, so the proxy waits longer than that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: greatacademy/origin-pull-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - voice.greatacademy.dev
      secretName: voice-tls
  rules:
    - host: voice.greatacademy.dev
      http:
        paths:
          - path: /v1/conversation
            pathType: Exact
            backend:
              service:
                name: voice
                port:
                  number: 8080
