# Everything of Great Academy on the cluster, in the namespace greatacademy: the API server and its jobs, the voice
# service of English, and their public hosts through the cluster's ingress-nginx. The database is the shared
# pg-cluster in cnpg-system.
# Secrets are made by keys.py, never committed, except the public CA of origin pulls; push.sh pins the images to pushed digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greatacademy
labels:
- pairs:
    app.kubernetes.io/part-of: greatacademy
resources:
- namespace.yaml
- api.yaml
- jobs.yaml
- voice.yaml
- scaling.yaml
- ingress.yaml
- network.yaml
configMapGenerator:
- envs:
  - api.env
  name: api
- envs:
  - voice.env
  name: voice
# The CA of the client certificate Cloudflare presents to the origin (README: Authenticated Origin Pulls). Its name
# stays fixed because the Ingresses name it in an annotation.
secretGenerator:
- files:
  - ca.crt=origin-pull-ca.crt
  name: origin-pull-ca
  options:
    disableNameSuffixHash: true
images:
- digest: sha256:1cd9e17cef126e8bd2738ab02b0ac90e25a3531ee4fe18274b1f84c910e07dde
  name: api
  newName: ghcr.io/greatacademy/api
- digest: sha256:1f2554f5f3cf325998170ddb9c08146060ada8c31e1fb045d6aed06915ed3551
  name: voice
  newName: ghcr.io/greatacademy/voice
