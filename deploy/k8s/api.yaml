# The API server (apps/server): better-auth, the Connect services and every subject, compiled in each pod before it
# listens. Stateless; the database is the shared pg-cluster in cnpg-system. The site's pages and the apps reach it at
# api.greatacademy.dev (ingress.yaml), and the voice service directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      enableServiceLinks: false
      # GHCR packages start private; the Secret ghcr holds a token that may read packages.
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      # The migrations of libs/db/drizzle run before the server starts: a new image's schema is in place before any pod
      # of it serves. They must keep working for the pods of the previous image until those stop.
      initContainers:
        - name: migrate
          image: api
          args: [migrate]
          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: api
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: api
          env:
            # The content's heap is about 600 MB; the rest is for requests.
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
          # Every subject is compiled before the server listens, about two seconds.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Lets the Service stop sending requests before the server closes.
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1280Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
