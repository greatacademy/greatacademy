---
# The migrations of libs/db/drizzle. Never scheduled: deploy.sh runs a Job from it before rolling the API.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: migrate
spec:
  schedule: "0 0 1 1 *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: true
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: migrate
            app.kubernetes.io/component: job
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: migrate
              image: api
              args: [migrate]
              envFrom:
                - configMapRef:
                    name: api
                - secretRef:
                    name: api
              resources:
                requests:
                  cpu: 100m
                  memory: 1280Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
