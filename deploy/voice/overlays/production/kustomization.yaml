# Production. VOICE_SPEECH stays unconfigured, refusing sessions, until a speech provider is set up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ga-voice
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: voice
    behavior: merge
    envs:
      - config.env
    literals:
      - VOICE_SPEECH=unconfigured
patches:
  - target:
      kind: ScaledObject
      name: voice
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/query
        value: sum(voice_sessions_active{namespace="ga-voice"})
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 20
# mise run voice:push production pins this to the pushed digest.
images:
  - name: ga-voice
    newName: ghcr.io/greatacademy/voice
